name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Only the packages the tests import. The ML stack (torch, transformers,
      # llama-cpp, demucs) is not needed to test routing, gates, and subtitles.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.0" "pydantic==2.9.2" "python-multipart==0.0.9" "pytest>=8,<9" "httpx>=0.27,<1"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build
        run: npm --prefix frontend run build
