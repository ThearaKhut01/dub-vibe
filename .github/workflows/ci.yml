name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Only the packages the tests import. The heavy ML stack (transformers,
      # llama-cpp, demucs) is not needed to test routing, gates, and subtitles.
      # numpy/requests/keyring/huggingface-hub are genuine runtime imports of
      # the modules under test (`backend.app.main` -> speaker_diarization,
      # hf_progress, api_keys), so they must be installed or collection fails.
      # huggingface-hub stays below 1.0: transformers (<5) does not support the
      # 1.x API, and 1.x added a `tqdm_class` kwarg the guarded signature test
      # deliberately pins as absent.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.0" "pydantic==2.9.2" "python-multipart==0.0.9" "pytest>=8,<9" "httpx>=0.27,<1" "numpy>=1.26,<3" "requests>=2.31" "keyring>=25" "huggingface-hub>=0.24,<1"

      # The gender classifier's unit tests exercise the vendored ECAPA layer, so
      # torch/torchaudio must import. CPU wheels only: no test touches a GPU and
      # the CUDA index would add ~2 GB to every run.
      - name: Install CPU torch
        run: python -m pip install "torch>=2.2" "torchaudio>=2.2" --index-url https://download.pytorch.org/whl/cpu

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build
        run: npm --prefix frontend run build
